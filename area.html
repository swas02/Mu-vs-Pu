<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Area and Rectangular Pieces</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        div {
            height: 480px;
            width: 480px;
        }
    </style>
</head>

<body>
    <div id="combinedPlot"></div>
    <p>Enter the number of rectangular pieces (n):
        <input type="number" id="numRectangles" value="10">
    </p>
    <button id="calculateBtn">Calculate Area</button>
    <p>Area of the circle: <span id="circleArea"></span></p>

    <script>
        ////////////////////////////////////////////////////////////////////
        y = [], area = 0, r = 1, d = 2 * r, division = Math.max(d * 5, 50)
        for (let index = 0; index <= 2 * r; index += d / division) {
            let a = 2 * Math.sqrt(Math.pow(r, 2) - Math.pow((index - r), 2)) * d / division
            y.push({ index, a })
            area += a
        }
        area <= Math.PI * Math.pow(r, 2), area
        ////////////////////////////////////////////////////////////////////


        document.getElementById('calculateBtn').addEventListener('click', function () {
            const r = 400; // Radius of the circle in mm
            const n = parseInt(document.getElementById('numRectangles').value);

            const dx = 2 * r / n; // Width of each rectangular piece
            let area = 0;

            const data = [];

            for (let i = 0; i < n; i++) {
                const x = -r + i * dx;
                const y = Math.sqrt(r * r - x * x);
                const rectangleArea = dx * y;
                area += rectangleArea;

                // Add rectangle to the plot
                data.push({
                    type: 'bar',
                    x: [x - dx / 2, x + dx / 2, x + dx / 2, x - dx / 2, x - dx / 2],
                    y: [0, 0, y, y, 0],
                    marker: {
                        color: 'green'
                    }
                });
            }

            document.getElementById('circleArea').textContent = area.toFixed(2) + ' mm²';

            // Add circle to the plot
            const theta = Array.from({ length: 361 }, (_, i) => i * Math.PI / 180);
            const circleData = {
                type: 'scatter',
                x: theta.map(t => r * Math.cos(t)),
                y: theta.map(t => r * Math.sin(t)),
                mode: 'markers',
                marker: {
                    size: 2,
                    color: 'blue'
                }
            };
            data.push(circleData);

            Plotly.newPlot('combinedPlot', data, { title: 'Circle and Rectangular Pieces' });
        });
    </script>
</body>

</html>

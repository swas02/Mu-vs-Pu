<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./plotly-latest.min.js"></script>
    <link rel="stylesheet" href="./water.css">
    <script src="./asset.js"></script>
    <style>
        /* Overall container for sections */
        .section {
            display: flex;
            /* flex-wrap: wrap; */
            /* Wrap sections on smaller screens */
            /* align-items: center; */
            justify-content: center;
            vertical-align: top;
        }

        #color {
            width: 201px;
            height: 42px;
        }

        td,
        th {
            text-align: center;
        }

        /* Left and right sections */
        .leftSection,
        .rightSection {
            margin: 5px;
            flex: 1;
            /* Make sections equally sized on large screens */
            padding: 1rem;
            /* Add some padding */
        }

        /* Responsive behavior for smaller screens */
        @media (max-width: 675px) {
            .section {
                flex-direction: column;
                /* Stack sections vertically */
            }

            .leftSection,
            .rightSection {
                flex: none;
                /* Remove flex-grow for full width on small screens */
                width: 100%;
                /* Set full width for each section */
            }
        }
    </style>
</head>

<body>
    <div class="section">
        <form class="leftSection" onsubmit="return sectionProperties();">
            <h2>Section Properties:</h2>
            <label for="maxX">Length in X axis (in mm):</label>
            <input type="number" value="350" id="maxX" required>
            <label for="maxY">Length in Y axis (in mm):</label>
            <input type="number" value="450" id="maxY" required>
            <label for="fck">Grade of concrete (in MPa):</label>
            <input type="number" value="25" id="fck" required>
            <input type="submit" value="Update">
        </form>
        <form class="rightSection" onsubmit="return reinforcementDetails()">
            <h2>Enter Reinforcement Details:</h2>
            <p><i>Note: Distance is to be measured from top left.</i></p>
            <label for="dia">Diameter (in mm):</label>
            <input type="number" id="dia" required>
            <label for="x">X Coordinate (in mm):</label>
            <input type="number" id="x" required>
            <label for="y">Y Coordinate (in mm):</label>
            <input type="number" id="y" required>
            <label for="fy">Grade of Steel:</label>
            <select id="fy">
                <option value="Fe415" selected>Fe415</option>
                <option value="Fe500" disabled>Fe500</option>
            </select>
            <label for="color">Colour:</label>
            <input id="color" value="#3780bf" type="color">
            <input type="submit" value="Add">
        </form>
    </div>

    <div class="section">
        <div id="plot"></div>
        <!-- <div class="leftSection">

        </div>
        <div class="rightSection">
             -->
        <!-- </div> -->
    </div>
    <div class="leftSection" id="circlesList">
    </div>
    <div id="myPlot" class="section" style="width:100%"></div>
    <div class="section" id="fullDetail">
        <div id="msd"></div>
    </div>
    <script defer>
        let circles = [
            {
                "dia": 16,
                "x": 50,
                "y": 50,
                "color": "#3780bf"
            },
            {
                "dia": 16,
                "x": 300,
                "y": 50,
                "color": "#3780bf"
            },
            {
                "dia": 16,
                "x": 50,
                "y": 225,
                "color": "#3780bf"
            },
            {
                "dia": 16,
                "x": 300,
                "y": 225,
                "color": "#3780bf"
            },
            {
                "dia": 16,
                "x": 300,
                "y": 400,
                "color": "#3780bf"
            },
            {
                "dia": 16,
                "x": 50,
                "y": 400,
                "color": "#3780bf"
            }
        ]
        let maxX = null;
        let maxY = null;

        function reinforcementDetails() {
            const dia = parseInt(document.getElementById("dia").value);
            const x = parseInt(document.getElementById("x").value);
            const y = parseInt(document.getElementById("y").value);
            const color = document.getElementById("color").value
            if (dia != '' && x != '' && y != '' && !isNaN(dia) && !isNaN(x) && !isNaN(y)) {
                circles.push({ dia, x, y, color });
                updateCirclesList();
                plotCircles();
            }
            return false;
        }

        function updateCirclesList() {
            const circlesList = document.getElementById("circlesList");
            circlesList.innerHTML = ""; // Clear previous list items
            circlesList.innerHTML = '<h2 class="">Reinforcement Details List:</h2>'
            // Create table element
            const table = document.createElement("table");
            table.classList.add("water-table"); // Add CSS class for styling

            // Create table header row
            const headerRow = document.createElement("tr");
            const colorRow = document.createElement("th");
            colorRow.textContent = "Color";
            const headerDia = document.createElement("th");
            headerDia.textContent = "Diameter (in mm)";
            const headerX = document.createElement("th");
            headerX.textContent = "X (in mm)";
            const headerY = document.createElement("th");
            headerY.textContent = "Y (in mm)";
            const headerDelete = document.createElement("th");
            headerDelete.textContent = "Delete";
            headerRow.appendChild(colorRow);
            headerRow.appendChild(headerDia);
            headerRow.appendChild(headerX);
            headerRow.appendChild(headerY);
            headerRow.appendChild(headerDelete);
            table.appendChild(headerRow);

            // Create data rows for each circle
            for (let i = 0; i < circles.length; i++) {
                const circle = circles[i];
                const dataRow = document.createElement("tr");
                const colortd = document.createElement("td");
                colortd.style.color = circle.color;
                colortd.textContent = '(●)'
                const dataDia = document.createElement("td");
                dataDia.textContent = circle.dia;
                const dataX = document.createElement("td");
                dataX.textContent = circle.x;
                const dataY = document.createElement("td");
                dataY.textContent = circle.y;

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.onclick = function () {
                    deleteCircle(i);
                };
                const deleteCell = document.createElement("td");
                deleteCell.appendChild(deleteButton);
                dataRow.appendChild(colortd);
                dataRow.appendChild(dataDia);
                dataRow.appendChild(dataX);
                dataRow.appendChild(dataY);
                dataRow.appendChild(deleteCell);

                table.appendChild(dataRow);
            }

            circlesList.appendChild(table);
        }


        function plotCircles() {
            const data = circles.map(circle => ({
                type: 'circle',
                x0: circle.x - circle.dia / 2,
                y0: circle.y - circle.dia / 2,
                x1: circle.x + circle.dia / 2,
                y1: circle.y + circle.dia / 2,
                line: {
                    color: circle.color
                },
                fillcolor: circle.color
            }));

            if (maxX !== null) {
                data.push({
                    type: 'line',
                    x0: maxX,
                    y0: 0,
                    x1: maxX,
                    y1: maxY,
                    // line: {
                    //     color: 'red'
                    // }
                });
                data.push({
                    type: 'line',
                    x0: 0,
                    y0: 0,
                    x1: 0,
                    y1: maxY,
                    // line: {
                    //     color: 'red'
                    // }
                });
            }

            if (maxY !== null) {
                data.push({
                    type: 'line',
                    x0: 0,
                    y0: maxY,
                    x1: maxX,
                    y1: maxY,
                    // line: {
                    //     color: 'green'
                    // }
                });
                data.push({
                    type: 'line',
                    x0: 0,
                    y0: 0,
                    x1: maxX,
                    y1: 0,
                    // line: {
                    //     color: 'red'
                    // }
                });
            }

            const layout = {
                xaxis: {
                    // Hide x-axis grid lines
                    showgrid: false,
                    zeroline: false,
                    title: 'x-axis'
                },

                yaxis: {
                    // Hide y-axis grid lines
                    showgrid: false,
                    autorange: 'reversed',
                    title: 'y-axis'
                },
                width: maxX,
                height: maxY,
                dimension: "ratio",
                shapes: data
            };

            Plotly.newPlot('plot', data, layout);
        }

        function deleteCircle(index) {
            circles.splice(index, 1);
            updateCirclesList();
            plotCircles();
        }


        function sectionProperties() {
            maxX = parseInt(document.getElementById("maxX").value);
            maxY = parseInt(document.getElementById("maxY").value);
            plotCircles();
            return false;
        }

        //test
        updateCirclesList();
        plotCircles();
        sectionProperties();
    </script>

</body>

</html>
